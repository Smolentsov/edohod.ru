<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контакты — edohod.ru</title>
<link rel="stylesheet" href="/style.css">

</head>
<body>
<header><div class="logo">ГАРАЖ<span>·</span>МАГНИТОГОРСК</div>
<nav><a href="/">Автомобили</a><a href="/contacts.html">Контакты</a></nav></header>
<div class="wrap">
<h1>Контакты</h1>
<table>
<tr><td>Телефон</td><td><b>8 963 0 966 966</b></td></tr>
<tr><td>Город</td><td>Магнитогорск</td></tr>
</table>
<p class="sub">Продаю личные автомобили, не автосалон.</p></div>

<footer>
  <div>8 963 0 966 966 · Магнитогорск</div>
  <div><button id="adminBtn" onclick="adminLogin()" title="admin">.</button></div>
</footer>
<script>
const CARS = ['toyota-camry-1991','renault-scenic-2001'];
function getState(){ return JSON.parse(localStorage.getItem('carState')||'{}'); }
function adminLogin(){
  if(sessionStorage.getItem('admin')==='1'){ openAdmin(); return; }
  const p = prompt('Пароль:');
  if(p==='edohod2026'){ sessionStorage.setItem('admin','1'); openAdmin(); } else if(p!==null){ alert('Неверный пароль'); }
}
function openAdmin(){
  let s = getState(), car = CARS[0];
  let html = '<div class="admin-panel"><h2>Админ-панель</h2><label>Автомобиль</label><select id="adCar">'+CARS.map(c=>'<option value="'+c+'">'+c+'</option>').join('')+'</select><label>Статус</label><select id="adStatus"><option value="sale">В продаже</option><option value="reserved">Забронировано</option><option value="sold">Продано</option></select><label>Дата окончания брони</label><input type="date" id="adDate"><button class="btn" onclick="saveState()">Сохранить</button><div id="adMsg" style="color:#9fd0a0;margin-top:10px"></div></div>';
  document.querySelector('.wrap').insertAdjacentHTML('afterbegin', html);
  const sel = document.getElementById('adCar');
  const load = ()=>{ const st = s[sel.value]||{status:'sale',date:''}; document.getElementById('adStatus').value=st.status; document.getElementById('adDate').value=st.date||''; };
  sel.onchange = load; load();
}
function saveState(){
  const s = getState();
  s[document.getElementById('adCar').value] = { status: document.getElementById('adStatus').value, date: document.getElementById('adDate').value };
  localStorage.setItem('carState', JSON.stringify(s));
  document.getElementById('adMsg').textContent = 'Сохранено. Обновите страницу автомобиля.';
}
function applyState(slug){
  const st = getState()[slug];
  if(!st) return;
  if(st.status==='reserved'){
    const d = st.date ? new Date(st.date).toLocaleDateString('ru-RU') : '';
    document.body.insertAdjacentHTML('beforeend','<div class="watermark"><div>Забронировано до '+d+'</div></div>');
  }
  if(st.status==='sold'){
    document.querySelector('.wrap').innerHTML = '<div class="sold-ph"><svg width="260" height="120" viewBox="0 0 260 120"><path d="M20 95 Q25 60 60 55 Q75 25 130 22 Q185 25 200 55 Q235 60 240 95 Z" fill="#1a1a1d" stroke="#3a3a3e"/><circle cx="70" cy="95" r="16" fill="#0a0a0b" stroke="#3a3a3e"/><circle cx="190" cy="95" r="16" fill="#0a0a0b" stroke="#3a3a3e"/></svg><span>Продано</span></div>';
  }
}
function askQuestion(slug){
  const last = localStorage.getItem('q_'+slug);
  if(last && Date.now()-last < 3600000){ alert('Повторное сообщение возможно через некоторое время'); return; }
  const t = document.getElementById('qtext').value.trim();
  if(!t) return;
  localStorage.setItem('q_'+slug, Date.now());
  document.getElementById('qtext').value='';
  alert('Вопрос отправлен. Ответ появится здесь после проверки продавцом.');
}
</script>

</body></html>
